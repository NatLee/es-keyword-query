<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc"><title id="title">es-keyword-query</title><desc id="desc">A Rust compiler from compact boolean expressions to Elasticsearch and OpenSearch query strings.</desc><rect width="1600" height="800" fill="#101d25"/><g stroke="#283941" stroke-width="1"><path d="M80 0v800M1520 0v800M0 80h1600M0 720h1600"/><path d="M800 80v640" stroke-dasharray="3 8"/></g><g font-family="monospace"><text x="112" y="130" fill="#6ce5bd" font-size="17" letter-spacing="4">RUST / QUERY COMPILER</text><text x="112" y="245" fill="#f3f4e8" font-size="82" font-weight="bold">es-keyword-query</text><text x="115" y="303" fill="#a1b4bb" font-size="23">Small syntax. Explicit structure. Search-ready output.</text><rect x="112" y="375" width="590" height="195" fill="#1a2c35" stroke="#39515a"/><text x="140" y="415" fill="#6ce5bd" font-size="15" letter-spacing="2">01 / EXPRESSION</text><text x="140" y="490" fill="#f3f4e8" font-size="34">(tea|coffee)&amp;shop!ad</text><path d="M724 471h90m-15-12 15 12-15 12" stroke="#6ce5bd" stroke-width="2" fill="none"/><rect x="840" y="375" width="648" height="195" fill="#e9efe8"/><text x="869" y="415" fill="#386150" font-size="15" letter-spacing="2">02 / QUERY_STRING</text><text x="869" y="475" fill="#132c26" font-size="25">("tea" OR "coffee")</text><text x="869" y="520" fill="#132c26" font-size="25">AND "shop" NOT "ad"</text><g font-size="15" letter-spacing="2" fill="#a1b4bb"><text x="112" y="660">NFKC NORMALIZE</text><text x="465" y="660">PARSE + VALIDATE</text><text x="865" y="660">QUOTE + COMPILE</text><text x="1300" y="660">MIT / 0.1</text></g></g></svg>