user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
# Startup diagnostics remain visible; request diagnostics use the safe access log.
error_log /dev/stderr crit;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format redacted '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
    access_log /dev/stdout redacted;
    sendfile on;
    server_tokens off;
    client_max_body_size 1m;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 5s;

    upstream compiler_api {
        zone compiler_api 64k;
        server api:8670 resolve;
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        # Even critical request failures may include an OAuth query string.
        error_log /dev/null crit;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location ~ ^/(api|oauth|\.well-known|mcp)(/|$) {
            proxy_pass http://compiler_api;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Origin $http_origin;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Forwarded "";
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location ~* \.mjs$ {
            default_type application/javascript;
            try_files $uri =404;
            add_header Cache-Control "no-cache";
            add_header X-Frame-Options DENY always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy same-origin always;
        }

        location ~* \.(css|mjs|js|map|json|png|jpe?g|gif|svg|ico|webp|woff2?|ttf)$ {
            try_files $uri =404;
            add_header Cache-Control "no-cache";
            add_header X-Frame-Options DENY always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy same-origin always;
        }

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
            add_header X-Frame-Options DENY always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy same-origin always;
        }
    }
}
