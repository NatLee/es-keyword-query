[package]
name = "es-keyword-query-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
publish = false

[dependencies]
tower = { version = "0.5", features = ["util"] }
url = "2"
es-keyword-query = { path = ".." }
access-kit = { path = "../crates/access-kit" }
anyhow = "1"
argon2 = "0.5"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
rmcp = { version = "=3.12.0", default-features = false, features = ["client", "transport-streamable-http-client-reqwest", "reqwest"] }
sdk-reqwest = { package = "reqwest", version = "0.13.2", default-features = false, features = ["json", "rustls"] }

[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
